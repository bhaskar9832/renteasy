name: CI/CD Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Backend
        working-directory: ./backend
        run: npm run build

      - name: Package Dist Artifact
        run: |
          mkdir release_staging
          
          mkdir release_staging/frontend
          cp -r frontend/dist release_staging/frontend/
          
          mkdir release_staging/backend
          cp -r backend/dist release_staging/backend/
          cp backend/package.json release_staging/backend/
          cp backend/package-lock.json release_staging/backend/
          
          COPYFILE_DISABLE=1 tar -czf renteasy-site.tar.gz -C release_staging .

      - name: Upload Build to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST || '72.61.243.226' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "renteasy-site.tar.gz"
          target: "/tmp/"

      - name: Activate Zero-Downtime Release on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST || '72.61.243.226' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e

            RELEASE_TAG=$(date +%Y%m%d-%H%M%S)
            BASE_DIR="/var/www/renteasy"
            RELEASE_DIR="$BASE_DIR/releases/$RELEASE_TAG"

            echo "Deploying release: $RELEASE_TAG"
            install -d -m 755 "$RELEASE_DIR"
            tar -xzf /tmp/renteasy-site.tar.gz -C "$RELEASE_DIR"
            chown -R www-data:www-data "$RELEASE_DIR" || true

            cd "$RELEASE_DIR/backend"
            npm ci --omit=dev

            ln -sfn "$RELEASE_DIR" $BASE_DIR/current

            pm2 restart renteasy-backend || pm2 start $BASE_DIR/current/backend/dist/server.js --name renteasy-backend

            nginx -t && systemctl reload nginx || echo "Nginx not running or not configured, skipping reload"

            rm -f /tmp/renteasy-site.tar.gz

            cd $BASE_DIR/releases
            ls -1dt * | tail -n +6 | xargs -r rm -rf

            echo "Deployment completed successfully. Active release: $RELEASE_DIR"
